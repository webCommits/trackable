{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Settings" %}{% endblock %}
{% block nav_settings %}active{% endblock %}

{% block content %}
<div class="content" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 8px; color: var(--ctp-mauve);">{% trans "Settings" %}</h2>
    <p style="color:var(--ctp-subtext0); margin-bottom:30px;">{% trans "Manage your personal preferences and notification settings." %}</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="email_notifications_enabled" {% if user.email_notifications_enabled %}checked{% endif %}>
                <span>
                    {% trans "Enable monthly email reports" %}
                    <small style="display:block; margin-top:4px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--ctp-subtext0);">
                        {% if monthly_report_day %}
                        {% blocktrans with day=monthly_report_day next_day=monthly_report_day|add:1 %}You will receive an automated email on the {{ day }}th of each month, covering the period from the {{ next_day }}th of the previous month through that day, with a summary of all your working hours.{% endblocktrans %}
                        {% else %}
                        {% trans "You will receive an automated email on the last day of each month with a summary of all your working hours." %}
                        {% endif %}
                    </small>
                </span>
            </label>
        </div>
        <button type="submit" class="btn btn-primary btn-form-submit">{% trans "Save" %}</button>
    </form>
</div>
{% endblock %}
